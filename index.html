<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<meta name="description" content="LifeOne Shop: fiat-priced products in your local currency.">
<title>LifeOne Shop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23008080'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<style>
/* ---------- Theme tokens ---------- */
:root{
  --bg:#F8F9FA; --surface:#FFFFFF; --ink:#111111; --mut:#6B7280;
  --acc:#008080; --acc-ink:#FFFFFF; --line:#E6E8EB; --glass:rgba(255,255,255,.86);
  --shadow:0 10px 30px rgba(0,0,0,.08);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0B0F10; --surface:#141B1D; --ink:#F3F4F6; --mut:#9CA3AF;
  --acc:#2DD4BF; --acc-ink:#04201E; --line:#1F2A2D; --glass:rgba(20,27,29,.86);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:background .35s ease,color .35s ease;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img,video{display:block}

/* ---------- Header ---------- */
.top{
  position:sticky;top:0;z-index:50;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;transition:background .35s ease;
}
.brand{font-weight:800;font-size:20px;letter-spacing:-.4px;flex:1;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink);font-style:normal;font-size:14px}
.brand small{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.chip{
  height:34px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:transform .15s ease,border-color .2s;
}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--acc)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Theme switch */
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);transition:background .35s ease}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:transform .4s cubic-bezier(.3,.7,.3,1);
}
.switch .sun,.switch .moon{position:absolute;top:6px;width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;transition:opacity .3s}
.switch .sun{left:6px;opacity:1}
.switch .moon{right:6px;opacity:.35}
[data-theme="dark"] .switch::after{transform:translateX(20px)}
[data-theme="dark"] .switch .sun{opacity:.35}
[data-theme="dark"] .switch .moon{opacity:1}

/* Search */
.searchbar{
  overflow:hidden;max-height:0;transition:max-height .35s ease,padding .35s ease;
  padding:0 14px;background:var(--glass);backdrop-filter:blur(14px);position:sticky;top:var(--top-h,64px);z-index:40;
}
.searchbar.open{max-height:72px;padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.searchbar input{
  width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  padding:0 14px;outline:none;font-size:15px;transition:border-color .2s;
}
.searchbar input:focus{border-color:var(--acc)}

/* ---------- Grid (edge to edge) ---------- */
.meta{padding:14px 14px 6px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:4px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--surface);overflow:hidden;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.media{position:relative;aspect-ratio:4/5;background:var(--line);overflow:hidden}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media video{opacity:0;transition:opacity .45s ease;z-index:1}
.card[data-state="live"] .media video{opacity:1}
.media img{transition:transform .6s ease}
.card[data-state="live"] .media img{transform:scale(1.03)}

/* Animated status badge */
.badge{
  position:absolute;left:8px;bottom:8px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;
  background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;letter-spacing:.2px;
  overflow:hidden;backdrop-filter:blur(6px);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#9CA3AF}
.badge .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc)}
.card[data-state="live"] .badge .dot{background:#2DD4BF;animation:pulse 1s ease-in-out infinite}
.card[data-state="live"] .badge{background:rgba(0,128,128,.85)}
.card.live .badge .bar{animation:fill 3.5s linear forwards}
.card[data-state="blocked"] .badge{background:rgba(0,0,0,.7);cursor:pointer}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
@keyframes fill{from{width:0}to{width:100%}}

.info{padding:10px 11px 12px}
.info h3{font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seller{font-size:12px;color:var(--mut);margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}
.price{font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.enq{height:30px;padding:0 11px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;transition:transform .15s}
.enq:active{transform:scale(.95)}

.empty{padding:48px 20px;text-align:center;color:var(--mut)}

/* ---------- Bottom nav (auto-hides on scroll) ---------- */
.nav{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  transform:translate(-50%,0);z-index:60;
  display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.3,.7,.3,1),opacity .3s;
}
.nav.hide{transform:translate(-50%,160%);opacity:0;pointer-events:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;padding:7px 10px;border-radius:16px;font-size:11px;font-weight:600;color:var(--mut);transition:color .2s,background .2s}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:560px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.7,.3,1);box-shadow:var(--shadow);
}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet p.sub{font-size:13px;color:var(--mut);margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--mut)}
.field input,.field textarea{
  border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;outline:none;font-size:15px;transition:border-color .2s;
}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
.submit{width:100%;height:48px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:15px;transition:transform .15s,opacity .2s}
.submit:active{transform:scale(.98)}
.submit:disabled{opacity:.6}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:100;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i>L</i>LifeOne <small>Shop</small></div>
  <button class="chip" id="region" aria-label="Change region">
    <span id="flag">🌐</span><span id="regionCode">--</span>
  </button>
  <button class="icon-btn" id="searchToggle" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <button class="switch" id="themeSw" role="switch" aria-checked="false" aria-label="Dark mode">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="searchbar" id="searchbar">
  <input id="q" type="search" placeholder="Search products or sellers" autocomplete="off" aria-label="Search">
</div>

<div class="meta"><span id="count">Loading…</span><span id="sourceLbl"></span></div>
<main class="grid" id="grid" aria-live="polite"></main>
<div class="empty" id="empty" hidden>No products match your search.</div>

<nav class="nav" id="nav" aria-label="Primary">
  <button class="on" data-tab="shop">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Shop
  </button>
  <button data-tab="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Search
  </button>
  <button data-tab="enquire">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Enquire
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h2 id="sheetTitle">Send an enquiry</h2>
  <p class="sub" id="sheetSub">Pricing shown in your local currency.</p>
  <form id="enqForm" novalidate>
    <input type="hidden" name="pid">
    <div class="field"><label for="nm">Name</label><input id="nm" name="nm" autocomplete="name" maxlength="80" required></div>
    <div class="field"><label for="ct">Email or phone</label><input id="ct" name="ct" autocomplete="email" maxlength="120" required></div>
    <div class="field"><label for="msg">Message (optional)</label><textarea id="msg" name="msg" maxlength="1000"></textarea></div>
    <button class="submit" type="submit" id="submitBtn">Send enquiry</button>
  </form>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   CONFIG
   Set your Supabase project to go live. Leave empty to run on sample data.
   ===================================================================== */
const CFG = { SB_URL: "", SB_KEY: "" };

/* ---------- Fiat-only policy ---------- */
const FIAT = Object.freeze(["USD","PKR","AED","GBP","CNY"]);
const BANNED = /usdt|tether|crypto|bitcoin|stablecoin|\bbtc\b|\beth\b/i;
// Indicative rates per 1 USD. Replace with a live FX source in production.
const RATES = Object.freeze({ USD:1, PKR:280.5, AED:3.6725, GBP:0.79, CNY:7.24 });
const REGIONS = Object.freeze({
  PK:{cur:"PKR",loc:"en-PK",name:"Pakistan",flag:"🇵🇰"},
  AE:{cur:"AED",loc:"en-AE",name:"UAE",flag:"🇦🇪"},
  US:{cur:"USD",loc:"en-US",name:"United States",flag:"🇺🇸"},
  GB:{cur:"GBP",loc:"en-GB",name:"United Kingdom",flag:"🇬🇧"},
  CN:{cur:"CNY",loc:"zh-CN",name:"China",flag:"🇨🇳"}
});

function guard(v){
  const s = String(v ?? "");
  if (BANNED.test(s)) throw new Error("Blocked: non-fiat content");
  return s;
}
function safeCur(c){
  const u = guard(c).toUpperCase();
  if (!FIAT.includes(u)) throw new Error("Unsupported currency");
  return u;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Sample data (Unsplash images + sample videos) ---------- */
const SAMPLE = [
  { id:"s1", title:"Aurora Chronograph Watch", seller:"Northline Atelier", price:189, currency:"USD",
    image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=900&q=80",
    video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
  { id:"s2", title:"Studio Wireless Headphones", seller:"Sonic Foundry Co.", price:249, currency:"USD",
    image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900&q=80",
    video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" },
  { id:"s3", title:"Heritage Leather Tote", seller:"Maison Verde", price:129, currency:"USD",
    image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=900&q=80",
    video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" }
];

/* ---------- State ---------- */
let sb = null;
let products = [];
let region = "US";
let activeCard = null;
const $ = s => document.querySelector(s);

/* =====================================================================
   THEME ENGINE (light default, persisted)
   ===================================================================== */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = t === "dark" ? "#0B0F10" : "#F8F9FA";
  $("#themeSw").setAttribute("aria-checked", String(t === "dark"));
}
function initTheme(){
  let t = "light";
  try { t = localStorage.getItem("lo_theme") || "light"; } catch(e){}
  applyTheme(t === "dark" ? "dark" : "light");
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("lo_theme", next); } catch(e){}
}

/* =====================================================================
   REGION + FIAT CONVERSION
   ===================================================================== */
async function detectRegion(){
  try {
    const saved = localStorage.getItem("lo_region");
    if (saved && REGIONS[saved]) return { code: saved, manual: true };
  } catch(e){}
  let code = null;
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 3000);
    const r = await fetch("https://ipapi.co/json/", { signal: ctl.signal });
    clearTimeout(t);
    code = (await r.json()).country_code;
  } catch(e){}
  return { code: REGIONS[code] ? code : "US", manual: false };
}
function setRegion(code){
  region = code;
  try { localStorage.setItem("lo_region", code); } catch(e){}
  $("#flag").textContent = REGIONS[code].flag;
  $("#regionCode").textContent = code;
  refreshPrices();
  toast(`Prices in ${REGIONS[code].cur} · ${REGIONS[code].name}`);
}
function cycleRegion(){
  const keys = Object.keys(REGIONS);
  setRegion(keys[(keys.indexOf(region) + 1) % keys.length]);
}
function convert(amount, from){
  const cur = safeCur(from);
  const target = REGIONS[region].cur;
  return (Number(amount) / RATES[cur]) * RATES[target];
}
function fmt(amount, from){
  const r = REGIONS[region];
  const decimals = r.cur === "PKR" || r.cur === "CNY" ? 0 : 2;
  return new Intl.NumberFormat(r.loc, { style:"currency", currency:r.cur, minimumFractionDigits:decimals, maximumFractionDigits:decimals }).format(convert(amount, from));
}

/* =====================================================================
   DATA
   ===================================================================== */
async function loadProducts(){
  if (window.supabase && CFG.SB_URL && CFG.SB_KEY){
    try {
      sb = window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY);
      const { data, error } = await sb.from("products")
        .select("id,title,price,currency,image_url,video_url,sellers(display_name)")
        .eq("status","active").order("created_at",{ascending:false});
      if (!error && data?.length){
        $("#sourceLbl").textContent = "Live";
        return data.flatMap(r => {
          try {
            return [{ id:r.id, title:guard(r.title), price:Number(r.price), currency:safeCur(r.currency),
              image:r.image_url, video:r.video_url, seller:guard(r.sellers?.display_name || "LifeOne Seller") }];
          } catch(e){ return []; }
        });
      }
    } catch(e){}
  }
  $("#sourceLbl").textContent = "Sample";
  return SAMPLE.map(p => ({...p}));
}

/* =====================================================================
   RENDER
   ===================================================================== */
function cardHTML(p){
  const img = esc(p.image), vid = esc(p.video);
  return `<article class="card" data-id="${esc(p.id)}" data-state="idle">
    <div class="media">
      <img src="${img}" alt="${esc(p.title)}" loading="lazy" decoding="async">
      <video muted playsinline autoplay preload="metadata" poster="${img}" src="${vid}" aria-label="Product preview video"></video>
      <button class="badge" type="button" aria-live="polite"><span class="dot"></span><span class="lbl">Preview 3.5s</span><i class="bar"></i></button>
    </div>
    <div class="info">
      <h3>${esc(p.title)}</h3>
      <p class="seller">${esc(p.seller)}</p>
      <div class="row">
        <span class="price" data-amt="${Number(p.price)}" data-cur="${esc(p.currency)}">${fmt(p.price, p.currency)}</span>
        <button class="enq" type="button" data-enq="${esc(p.id)}">Enquire</button>
      </div>
    </div>
  </article>`;
}

const videoObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const card = e.target;
    if (e.isIntersecting && e.intersectionRatio >= 0.6) startPreview(card);
    else if (card === activeCard) stopPreview(card);
  });
}, { threshold:[0, 0.6] });

function renderGrid(list){
  videoObserver.disconnect();
  const grid = $("#grid");
  grid.innerHTML = list.map(cardHTML).join("");
  grid.querySelectorAll(".card").forEach(c => {
    const v = c.querySelector("video");
    v.muted = true;
    v.playsInline = true;
    v.setAttribute("muted","");
    v.setAttribute("playsinline","");
    // Autoplay attribute is set, but off-screen loads are paused immediately
    v.addEventListener("play", () => { if (c.dataset.state !== "live") v.pause(); });
    v.addEventListener("timeupdate", () => { if (c.dataset.state === "live" && v.currentTime >= 3.5) stopPreview(c); });
    videoObserver.observe(c);
  });
  $("#count").textContent = `${list.length} product${list.length === 1 ? "" : "s"}`;
  $("#empty").hidden = list.length > 0;
}
function refreshPrices(){
  document.querySelectorAll(".price").forEach(el => {
    el.textContent = fmt(Number(el.dataset.amt), el.dataset.cur);
  });
}

/* =====================================================================
   VIDEO AUTOPLAY CONTROLLER
   Plays muted for exactly 3.5s when >=60% visible; pauses automatically.
   ===================================================================== */
function setState(card, state, label){
  card.dataset.state = state;
  card.querySelector(".lbl").textContent = label;
}
function startPreview(card){
  if (card.dataset.state === "live") return;
  if (activeCard && activeCard !== card) stopPreview(activeCard);
  const v = card.querySelector("video");
  v.muted = true;
  v.currentTime = 0;
  activeCard = card;
  setState(card, "live", "Playing · 3.5s");
  card.classList.remove("live"); void card.offsetWidth; card.classList.add("live");
  clearTimeout(card._t);
  card._t = setTimeout(() => stopPreview(card), 3500);
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    clearTimeout(card._t);
    card.classList.remove("live");
    setState(card, "blocked", "Tap to preview");
    if (activeCard === card) activeCard = null;
  });
}
function stopPreview(card){
  clearTimeout(card._t);
  card.querySelector("video").pause();
  card.classList.remove("live");
  if (card.dataset.state !== "blocked") setState(card, "idle", "Preview 3.5s");
  if (activeCard === card) activeCard = null;
}

/* =====================================================================
   ENQUIRY SHEET
   ===================================================================== */
function openSheet(pid){
  const p = products.find(x => x.id === pid);
  const f = $("#enqForm");
  f.pid.value = p && sb ? pid : "";
  $("#sheetTitle").textContent = p ? "Enquire about this item" : "General enquiry";
  $("#sheetSub").textContent = p ? `${p.title} · ${fmt(p.price, p.currency)}` : "Pricing shown in your local currency.";
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  setTimeout(() => f.nm.focus(), 350);
}
function closeSheet(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
}
async function submitEnquiry(e){
  e.preventDefault();
  const f = e.target;
  const btn = $("#submitBtn");
  const name = f.nm.value.trim(), contact = f.ct.value.trim(), message = f.msg.value.trim();
  if (name.length < 2 || contact.length < 5) return toast("Please add your name and contact.");
  btn.disabled = true;
  try {
    const row = {
      product_id: f.pid.value || null,
      name: guard(name), contact: guard(contact), message: guard(message) || null,
      buyer_country: region, currency: REGIONS[region].cur
    };
    if (sb){
      const { error } = await sb.from("inquiries").insert(row);
      if (error) throw error;
    }
    f.reset();
    closeSheet();
    toast("Enquiry sent. We'll be in touch.");
  } catch(err){
    toast(err.message.startsWith("Blocked") ? "Message contains disallowed terms." : "Could not send. Please try again.");
  } finally {
    btn.disabled = false;
  }
}

/* =====================================================================
   UI: toast, nav auto-hide, search
   ===================================================================== */
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

let lastY = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (Math.abs(y - lastY) < 8) return;
  $("#nav").classList.toggle("hide", y > lastY && y > 120);
  lastY = y;
}, { passive:true });

function filterGrid(){
  const q = $("#q").value.trim().toLowerCase();
  const list = !q ? products : products.filter(p =>
    p.title.toLowerCase().includes(q) || p.seller.toLowerCase().includes(q));
  renderGrid(list);
}

function setTab(tab){
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function bindEvents(){
  $("#themeSw").addEventListener("click", toggleTheme);
  $("#region").addEventListener("click", cycleRegion);
  $("#searchToggle").addEventListener("click", () => {
    const sbar = $("#searchbar");
    const open = !sbar.classList.contains("open");
    sbar.classList.toggle("open", open);
    if (open) setTimeout(() => $("#q").focus(), 250);
  });
  $("#q").addEventListener("input", filterGrid);

  $("#grid").addEventListener("click", e => {
    const badge = e.target.closest(".badge");
    if (badge){
      const card = badge.closest(".card");
      if (card.dataset.state === "blocked") startPreview(card);
      return;
    }
    const enq = e.target.closest("[data-enq]");
    if (enq) openSheet(enq.dataset.enq);
  });

  document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
    const tab = b.dataset.tab;
    setTab(tab);
    if (tab === "shop") window.scrollTo({ top:0, behavior:"smooth" });
    if (tab === "search"){
      $("#searchbar").classList.add("open");
      setTimeout(() => $("#q").focus(), 250);
    }
    if (tab === "enquire") openSheet("");
  }));

  $("#scrim").addEventListener("click", closeSheet);
  $("#enqForm").addEventListener("submit", submitEnquiry);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  initTheme();
  bindEvents();
  const r = await detectRegion();
  region = r.code;
  $("#flag").textContent = REGIONS[region].flag;
  $("#regionCode").textContent = region;
  products = await loadProducts();
  renderGrid(products);
  if (!r.manual) toast(`Showing prices for ${REGIONS[region].name}`);
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    // Register a service worker here for offline/PWA caching when you deploy.
  }
})();
</script>
</body>
