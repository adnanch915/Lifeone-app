<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 5l21 7.5v15.5c0 13.5-8.8 24-21 28.5C19.8 52 11 41.5 11 28V12.5z' fill='url(%23g)'/%3E%3Cpath d='M23 32.5l6.5 6.5 12-13' fill='none' stroke='%23ffffff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOne V1.0 Enterprise</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:light;--bg:#fff;--card:#F8FAFC;--line:#E2E8F0;--ink:#0F172A;--mut:#64748B;--pri:#7C3AED;--pri2:#F5F3FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.btn{transition:transform .15s,background .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}.btn:active{transform:scale(.96)}
.pri{background:var(--pri);color:#fff}.pri:hover{background:#6D28D9}
.out{background:#fff;border:1px solid var(--line);color:var(--ink)}.out:hover{border-color:#C4B5FD;background:var(--pri2)}
.inp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;width:100%;color:var(--ink);outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.tab-content{display:none}.tab-content.active{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);align-items:flex-end;justify-content:center;padding:1rem}
.modal.on{display:flex}@media(min-width:640px){.modal{align-items:center}}
.sheet{background:#fff;border:1px solid var(--line);border-radius:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto;padding:1.25rem;box-shadow:0 24px 60px rgba(15,23,42,.18)}
.tab{color:var(--mut)}.tab.on{color:var(--pri)}.tab.on .bar{opacity:1}.bar{opacity:0;height:3px;width:28px;border-radius:3px;background:var(--pri);transition:opacity .2s}
.ping{animation:p 1.6s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}100%{box-shadow:0 0 0 8px rgba(244,63,94,0)}}
.gp{animation:g 1.6s infinite}@keyframes g{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}100%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
.done .t{text-decoration:line-through;color:var(--mut)}
.rec{animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
.spin{animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.lock{filter:blur(5px);pointer-events:none;user-select:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0;transition:background .2s,border-color .2s}
.chk:hover{border-color:var(--pri)}
.chk svg{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s}
.chk.on{background:var(--pri);border-color:var(--pri);animation:pop .35s}.chk.on svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.25)}}
.done .t{transition:color .3s}
.ring{animation:rg .5s infinite alternate}@keyframes rg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.unauth>header,.unauth>main,.unauth>nav{display:none!important}
.tile[aria-pressed="true"]{border-color:var(--pri);background:var(--pri2)}
html[dir=rtl] .text-left{text-align:right}
html[dir=rtl] .text-right{text-align:left}
html[dir=rtl] #bal,html[dir=rtl] #inf,html[dir=rtl] #outf,html[dir=rtl] #allocTot,html[dir=rtl] #alloc b,html[dir=rtl] #txList b,html[dir=rtl] #rate,html[dir=rtl] #cnt,html[dir=rtl] #ringPct,html[dir=rtl] #callTime,html[dir=rtl] .ltr{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] input[type=tel],html[dir=rtl] input[type=email],html[dir=rtl] input[type=number],html[dir=rtl] input[type=datetime-local],html[dir=rtl] .otpi,html[dir=rtl] #otpBoxes,html[dir=rtl] #invMsg,html[dir=rtl] #aPhone,html[dir=rtl] #invTo{direction:ltr;text-align:start}
html[dir=rtl] input,html[dir=rtl] textarea,html[dir=rtl] select{text-align:start}
html[dir=rtl] .sheet,html[dir=rtl] .card{direction:rtl}

/* ---- Dark theme: applies to the whole app ---- */
html.dark{color-scheme:dark;--bg:#0B1120;--card:#121B2E;--line:#27324A;--ink:#E2E8F0;--mut:#94A3B8;--pri2:#1E1B3A}
html.dark body{background:var(--bg);color:var(--ink)}
html.dark .bg-white,html.dark header,html.dark nav,html.dark .sheet{background:#0F1729!important;color:var(--ink)}
html.dark .card{background:var(--card);border-color:var(--line)}
html.dark .out{background:#121B2E;color:var(--ink);border-color:var(--line)}
html.dark .out:hover{background:#1E1B3A}
html.dark .inp{background:#0F1729;color:var(--ink);border-color:var(--line)}
html.dark .inp[readonly]{background:#162238!important}
html.dark .bg-slate-50,html.dark .bg-slate-100,html.dark [style*="#F8FAFC"],html.dark [style*="#F1F5F9"]{background:#162238!important;border-color:var(--line)}
html.dark .text-slate-900,html.dark .text-slate-800,html.dark .text-slate-700{color:var(--ink)!important}
html.dark .text-slate-600,html.dark .text-slate-500,html.dark .text-slate-400{color:var(--mut)!important}
html.dark .border-slate-200,html.dark .border-slate-100,html.dark .border-white{border-color:var(--line)!important}
html.dark .bg-emerald-50{background:rgba(16,185,129,.14)!important}
html.dark .bg-amber-50{background:rgba(245,158,11,.14)!important}
html.dark .bg-rose-50{background:rgba(244,63,94,.14)!important}
html.dark .modal{background:rgba(2,6,23,.7)}
html.dark #proCard{background:var(--card)!important;border-color:#3B2F6B!important}
html.dark .tab{color:var(--mut)}
html.dark .tab.on{color:var(--pri)}
</style>
</head>
<body class="unauth">
<header class="sticky top-0 z-40 bg-white" style="border-bottom:1px solid var(--line)">
 <div class="max-w-3xl mx-auto flex items-center justify-between px-4 py-3 gap-2">
  <div class="flex items-center gap-2 min-w-0">
   <span class="w-8 h-8 rounded-lg pri flex items-center justify-center" data-ic="shield" data-s="18"></span>
   <b class="text-lg tracking-tight whitespace-nowrap">LifeOne <span style="color:var(--pri)">V1.0</span></b>
   <span id="proChip" class="hidden text-[10px] font-semibold px-2 py-0.5 rounded-full" style="background:var(--pri2);color:var(--pri)">PRO</span>
  </div>
  <div class="flex items-center gap-2">
   
   <span id="hdrClock" class="text-[11px] font-medium whitespace-nowrap hidden sm:inline" style="color:var(--mut)" aria-live="off"></span>
   <label class="relative btn out h-9 rounded-xl px-2.5 flex items-center gap-1.5 cursor-pointer">
   <span style="color:var(--mut)" data-ic="globe" data-s="16"></span>
   <span id="flag" class="inline-flex w-3.5 h-2.5 rounded-sm overflow-hidden shrink-0" aria-hidden="true"></span>
   <select id="lang" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" aria-label="Interface language">
    <option value="en">English</option><option value="ur">اردو</option><option value="ar">العربية</option><option value="zh">中文</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option>
   </select></label>
   <button id="themeBtn" onclick="toggleTheme()" class="btn out w-10 h-10 rounded-full shrink-0" aria-label="Theme"></button>
   <button id="bell" class="btn out relative w-10 h-10 rounded-full" aria-label="Notifications"><span data-ic="bell"></span>
    <span id="bellDot" class="absolute -top-1 -end-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold items-center justify-center" style="display:none"></span></button>
  </div>
 </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-4 pb-28">
 <section id="tab-home" class="tab-content space-y-4">
  <div class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF 0%,#FFFFFF 70%);border:1px solid #DDD6FE">
   <div class="flex items-start justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0"><div class="av"></div>
     <div class="min-w-0"><p class="text-xs" style="color:var(--mut)" id="today"></p><h1 class="text-lg font-bold leading-snug" id="greet"></h1></div></div>
    <span class="px-2.5 py-1 rounded-full text-xs font-semibold inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 shrink-0"><span data-ic="flame" data-s="13"></span><b id="streak">0</b><span data-i18n="streak"></span></span>
   </div>
   <p class="text-sm mt-1.5" style="color:var(--mut)" data-i18n="tag"></p>
   <div class="flex flex-wrap items-center gap-2 mt-3">
    <span id="homeVer" class="contents"></span>
   </div>
  </div>

  <div id="locSetting" class="card p-4"></div>
  <div class="rounded-2xl p-4 bg-white" style="border:1px solid #DDD6FE;box-shadow:0 12px 32px -14px rgba(124,58,237,.28)">
   <div class="flex items-center justify-between gap-2 mb-2">
    <div class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg pri flex items-center justify-center" data-ic="sparkle" data-s="15"></span><b class="text-sm" data-i18n="cpTitle"></b></div>
    <span id="cpUsage" class="text-[11px]" style="color:var(--mut)"></span>
   </div>
   <div class="flex items-center gap-2 rounded-xl px-3 py-2" style="border:1px solid var(--line)">
    <input id="cpIn" class="flex-1 min-w-0 outline-none bg-transparent text-sm" data-ph="cpPh">
    <button id="cpMic" onclick="cpVoice()" class="btn out w-8 h-8 rounded-lg shrink-0" aria-label="Voice input"></button>
    <button onclick="cpRun()" class="btn pri w-8 h-8 rounded-lg shrink-0" aria-label="Ask" data-ic="send" data-s="15"></button>
   </div>
   <div id="cpChips" class="flex flex-wrap gap-1.5 mt-2.5"></div>
   <div id="cpOut" class="hidden mt-3"></div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
   <div class="card p-5 flex items-center gap-4">
    <svg width="96" height="96" viewBox="0 0 96 96" class="shrink-0" aria-hidden="true"><defs><linearGradient id="gHar" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient></defs><circle cx="48" cy="48" r="38" fill="none" stroke="#E2E8F0" stroke-width="9"/><circle id="ringArc" cx="48" cy="48" r="38" fill="none" stroke="url(#gHar)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 48 48)" style="transition:stroke-dashoffset .6s ease"/><text id="ringPct" x="48" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">0%</text></svg>
    <div class="min-w-0"><p class="text-[11px] uppercase tracking-wider" style="color:var(--mut)" data-i18n="harmony"></p><p id="cnt" class="font-semibold mt-1 text-sm"></p><p id="ringSub" class="text-xs mt-1" style="color:var(--mut)"></p></div>
   </div>
   <div class="card p-5">
    <h3 class="font-semibold text-sm mb-3" data-i18n="habits"></h3>
    <div id="habitList" class="space-y-3.5"></div>
   </div>
  </div>

  <div class="card p-5">
   <div class="flex items-center justify-between gap-2 mb-4">
    <h2 class="font-semibold" data-i18n="timeline"></h2>
    <button class="btn pri rounded-full ps-3 pe-4 py-1.5 text-xs font-medium" onclick="openM('mTask')"><span data-ic="plus" data-s="14"></span><span data-i18n="newTask"></span></button>
   </div>
   <ol id="homeTasks" class="list-none"></ol>
  </div>

  <div class="card p-5">
   <h3 class="font-semibold text-sm mb-3" data-i18n="familyNow"></h3>
   <div id="homeFam" class="space-y-2.5"></div>
  </div>
 </section>

 <section id="tab-tasks" class="tab-content space-y-4">
  <div class="flex items-center justify-between"><h2 class="text-xl font-bold" data-i18n="tasks"></h2>
   <button class="btn pri rounded-full ps-3 pe-4 py-2 text-sm font-medium" onclick="openM('mTask')"><span data-ic="plus" data-s="16"></span><span data-i18n="newTask"></span></button></div>
  <div id="filters" class="flex gap-2 overflow-x-auto pb-1"></div>
  <ul id="taskList" class="space-y-2"></ul>
 </section>

 <section id="tab-money" class="tab-content space-y-4">
  <div class="flex items-start justify-between gap-3">
   <div class="min-w-0"><h2 class="text-lg font-bold" data-i18n="trk"></h2><p id="monthLbl" class="text-xs mt-0.5" style="color:var(--mut)"></p></div>
   <div class="flex items-center gap-2 shrink-0"><select id="curHdr" onchange="setCur(this.value)" class="inp text-xs" style="width:auto;padding:.3rem .5rem" aria-label="Currency"></select><button id="maskBtn" onclick="toggleMask()" class="btn out w-9 h-9 rounded-full"></button></div>
  </div>
  
  <div class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF,#fff);border:1px solid #DDD6FE">
   <div class="flex items-center justify-between gap-2"><p class="text-[11px] uppercase tracking-wider" style="color:var(--mut)" data-i18n="bal"></p><div class="flex items-center gap-2"><button onclick="openTx()" class="btn pri rounded-full px-2.5 py-1 text-[11px] font-medium" aria-label="Add Transaction"><span data-ic="plus" data-s="12"></span><span data-i18n="addTx"></span></button></div></div>
   <p id="bal" class="text-2xl sm:text-3xl font-bold mt-2 tracking-tight"></p>
  </div>
  <div class="grid grid-cols-2 gap-3">
   <div class="card p-4"><div class="flex items-center gap-2 text-xs text-emerald-600 font-medium"><span data-ic="arrowin" data-s="16"></span><span data-i18n="inf"></span></div><p id="inf" class="text-base sm:text-lg font-semibold mt-1.5"></p></div>
   <div class="card p-4"><div class="flex items-center gap-2 text-xs text-rose-600 font-medium"><span data-ic="arrowout" data-s="16"></span><span data-i18n="outf"></span></div><p id="outf" class="text-base sm:text-lg font-semibold mt-1.5"></p></div>
  </div>
  <div class="card p-5">
   <div class="flex items-center justify-between gap-2"><h3 class="font-semibold text-sm" data-i18n="alloc"></h3><b id="allocTot" class="text-sm"></b></div>
   <ul id="alloc" class="divide-y divide-slate-200 mt-1"></ul>
  </div>
  <div class="card p-5">
   <div class="flex items-center justify-between gap-2 mb-3"><h3 class="font-semibold text-sm" data-i18n="txTitle"></h3></div>
   <input id="txSearch" oninput="renderTx()" class="inp mb-1" data-ph="txSearch">
   <ul id="txList" class="divide-y divide-slate-200"></ul>
   <p class="text-[11px] mt-2" style="color:var(--mut)" data-i18n="sample"></p>
  </div>
  <p id="rate" class="text-[11px] text-center" style="color:var(--mut)"></p>
 </section>

 <section id="tab-family" class="tab-content space-y-3">
  <div class="flex items-center justify-between gap-2"><h2 class="text-xl font-bold" data-i18n="fam"></h2><button onclick="openSearchModal()" class="btn pri rounded-full px-3 py-1.5 text-xs font-medium inline-flex items-center gap-1.5 shrink-0"><span data-ic="plus" data-s="14"></span><span data-i18n="searchMember"></span></button></div>
  <div id="chatList" class="card p-2 space-y-1"></div>
  <div class="card p-4 space-y-3">
   <div class="flex items-center gap-2 rounded-xl px-3 py-2" style="border:1px solid var(--line)"><span style="color:var(--mut)" data-ic="search" data-s="16"></span>
    <input id="famQ" oninput="famSearch()" class="flex-1 min-w-0 outline-none bg-transparent text-sm" data-ph="famQph" autocomplete="off"></div>
   <div id="famRes" class="space-y-2"></div>
  </div>
  <div id="famList" class="space-y-3"></div>
 </section>

 <section id="tab-profile" class="tab-content space-y-4">
  <h2 class="text-lg font-bold" data-i18n="profile"></h2>
  <div class="card p-5 space-y-4">
   <div class="flex items-center gap-4"><div class="av big cursor-pointer" role="button" tabindex="0" title="Change photo" onclick="$('file').click()"></div>
    <label class="btn out px-4 py-2 rounded-xl text-sm cursor-pointer"><span data-ic="upload" data-s="16"></span><span data-i18n="photo"></span><input id="file" type="file" accept="image/*" class="hidden"></label></div>
   <label class="block text-sm"><span style="color:var(--mut)" data-i18n="name"></span><input id="pName" class="inp mt-1"></label>
   <label class="block text-sm"><span style="color:var(--mut)" data-i18n="email"></span><input id="pEmail" type="email" class="inp mt-1"></label>
   <div class="text-sm"><span style="color:var(--mut)" data-i18n="loc"></span><input id="pLoc" class="inp mt-1" readonly tabindex="-1" style="background:#F1F5F9;cursor:not-allowed"><p class="text-xs mt-1.5 inline-flex items-center gap-1" style="color:var(--mut)"><span data-ic="lock" data-s="12"></span><span data-i18n="locLock"></span></p></div>
   <button id="saveP" class="btn pri w-full rounded-xl py-2.5 text-sm font-medium" data-i18n="save"></button>
  </div>
  
  <div id="profTrust" style="display:none"></div>
  <div id="proCard" class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF,#fff);border:1px solid #DDD6FE"></div>
  <div class="card p-5 space-y-3">
   <button class="btn out w-full py-2.5 rounded-xl text-sm" onclick="openInvite('')"><span data-ic="share" data-s="18"></span><span data-i18n="invite"></span></button>
   <button class="btn out w-full py-2.5 rounded-xl text-sm" onclick="openM('mPw')"><span data-ic="key" data-s="18"></span><span data-i18n="pw"></span></button>
  </div>
  <div class="pt-2"><button onclick="openM('mOut')" class="btn w-full py-3.5 rounded-xl text-sm font-semibold text-white" style="background:#E11D48"><span data-ic="logout" data-s="18"></span><span data-i18n="logout"></span></button></div>
 </section>
</main>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-white" style="border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)">
 <div class="max-w-3xl mx-auto grid grid-cols-5" id="tabs"></div>
</nav>

<!-- Modals -->
<div id="mTrust" class="modal"><div class="sheet space-y-3"><div class="flex items-center justify-between gap-3"><h3 id="trustTitle" class="font-bold text-lg"></h3><button class="btn out w-9 h-9 rounded-full shrink-0" onclick="closeM('mTrust')" aria-label="Close">&times;</button></div><div id="trustBody" class="text-sm"></div></div></div>
<div id="mTask" class="modal"><div class="sheet space-y-3">
 <h3 class="font-bold text-lg" data-i18n="newTask"></h3>
 <input id="tTitle" class="inp" data-ph="title"><select id="tCat" class="inp"></select><select id="tUrg" class="inp"></select>
 <div><span class="text-sm" style="color:var(--mut)" data-i18n="time"></span><input id="tTime" type="time" class="inp mt-1"><button type="button" onclick="plus1()" class="text-sm mt-1.5 inline-flex items-center gap-1" style="color:var(--pri)"><span data-ic="clock" data-s="14"></span><span data-i18n="in1"></span></button></div>
 <div class="flex gap-2"><button class="btn out flex-1 py-2.5 rounded-xl" onclick="closeM('mTask')" data-i18n="cancel"></button>
 <button class="btn pri flex-1 py-2.5 rounded-xl" onclick="addTask()" data-i18n="add"></button></div>
</div></div>

<div id="mNotif" class="modal"><div class="sheet">
 <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg" data-i18n="notif"></h3>
  <button class="text-sm" style="color:var(--pri)" onclick="readAll()" data-i18n="readAll"></button></div>
 <ul id="nList" class="space-y-2"></ul>
 <button class="btn out w-full py-2.5 rounded-xl mt-3" onclick="closeM('mNotif')" data-i18n="close"></button>
</div></div>

<div id="mCall" class="modal"><div class="sheet text-center space-y-3">
 <div id="vidBox" class="hidden relative rounded-2xl overflow-hidden bg-slate-900" style="aspect-ratio:4/3">
  <div id="remoteTile" class="absolute inset-0 flex items-center justify-center"><div id="callAv2"></div></div>
  <video id="localV" autoplay muted playsinline class="absolute bottom-2 end-2 w-24 rounded-lg border-2 border-white bg-slate-700" style="aspect-ratio:3/4;object-fit:cover"></video>
 </div>
 <div id="audBox" class="pt-2"><div class="mx-auto w-fit" id="callAv"></div></div>

  if(a==="req"){f.me=true;f.them=false;renderFam();const {error}=await sb.from("location_shares").upsert({requester_id:me,target_id:k,status:"pending",updated_at:now},{onConflict:"requester_id,target_id"});if(error)throw error;
    setOwnShare(true);toast(t("reqSent").replace("{n}",n))}
  else if(a==="acc"){if(!canShare(f)){toast(t("limitHit").replace("{n}",pl().max));openPlans();return}
    f.me=true;f.them=true;renderFam();const {data,error}=await sb.from("location_shares").update({status:"accepted",updated_at:now}).eq("requester_id",k).eq("target_id",me).select();if(error)throw error;
    if(!data||!data.length){toast(t("locGone"));await loadLocReqs();return}

  else if(a==="dec"){f.me=false;f.them=false;renderFam();const {error}=await sb.from("location_shares").delete().eq("requester_id",k).eq("target_id",me);if(error)throw error;toast(t("declined"))}
  else{f.me=false;f.them=false;renderFam();const {error}=await sb.from("location_shares").delete().or(`and(requester_id.eq.${me},target_id.eq.${k}),and(requester_id.eq.${k},target_id.eq.${me})`);if(error)throw error;
    if(a==="stop")toast(t("stopped").replace("{n}",n))}
 }catch(e){console.warn("location request:",e&&(e.code||e.message));toast(locErrMsg(e))}

async function loadLocReqs(){if(!sb||!S.user.uid)return;

 const {data:locs,error}=await sb.from("live_locations").select("owner_id,latitude,longitude,formatted_address,updated_at").in("owner_id",ids);
 if(error){console.warn("live_locations:",error.message);return}
 const map={};(locs||[]).forEach(l=>{map[l.owner_id]=l});
 S.fam.forEach(f=>{const l=map[f.key];
  f.lat=l?l.latitude:null;f.lng=l?l.longitude:null;
  if(l){f.city=l.formatted_address||"";f.ts=Date.parse(l.updated_at)||Date.now()}});
 const sig=JSON.stringify(S.fam.map(f=>[f.key,f.lat,f.lng,f.city]));

 if(a==="req"){f.me=true;toast(t("reqSent").replace("{n}",n))}
 else if(a==="acc"){f.me=true;if(consentOf(f)==="active"){S.notifs.unshift({t:t("nowShare").replace("{n}",n),r:false});renderNotifs()}}
 else if(a==="dec"){f.me=false;f.them=false;toast(t("declined"))}
 else if(a==="cancel"||a==="stop"){f.me=false;f.them=false;if(a==="stop")toast(t("stopped").replace("{n}",n))}
 else if(a==="demo"){f.them=true;if(consentOf(f)==="active"){S.notifs.unshift({t:t("nowShare").replace("{n}",n),r:false});renderNotifs()}}
 renderFam();renderTrust();renderShield();renderHomeFam();}

// Optional columns: removed from an insert automatically if the messages table does not have them.
const OPTIONAL_COLS=["audience","sender_name","is_read","voice_url","voice_dur"];
const MISSING=new Set();
// Reads the column name from a PostgREST / Postgres "column does not exist" message
function missingCol(e){const msg=String((e&&e.message)||"");
 const m=msg.match(/['"]([a-z_]+)['"]\s*column/i)||msg.match(/column\s+(?:[a-z_]+\.)?['"]?([a-z_]+)['"]?/i);
 return m?m[1].toLowerCase():null}
const msgFilter=me=>`sender_id.eq.${me},receiver_id.eq.${me}`+(MISSING.has("audience")?"":`,audience.cs.{${me}}`);
// Reads the message history; if a column is missing it is recorded and the query is retried without it
async function fetchMsgs(me,after){
 const run=()=>{let q=sb.from("messages").select("*").or(msgFilter(me));if(after)q=q.gt("created_at",after);
  return q.order("created_at",{ascending:true}).limit(after?100:500)};
 let r=await run();
 const c=r.error&&missingCol(r.error);
 if(c&&OPTIONAL_COLS.includes(c)&&!MISSING.has(c)){MISSING.add(c);r=await run()}
 return r}
// Inserts one message row; drops optional columns the table does not have
async function insertRow(row){
 if(row.voice_url!==undefined&&MISSING.has("voice_url"))return {error:{code:"VOICE",message:"voice columns missing"}};
 let r=Object.assign({},row);
 for(let n=0;n<OPTIONAL_COLS.length+2;n++){
  const res=await DB.sendMessage(r);const e=res&&res.error;
  if(!e)return res;
  const c=missingCol(e);
  if(c&&OPTIONAL_COLS.includes(c)&&c in r){
   MISSING.add(c);
   if(c==="voice_url"||c==="voice_dur")return {error:{code:"VOICE",message:e.message}};
   delete r[c];
   if(c==="audience"&&!r.receiver_id)return {error:{code:"NO_AUDIENCE",message:e.message}};
   continue}
  return res}
 return {error:{message:"insert failed"}}}

async function detectCountry(){
 try{const r=new Intl.Locale(navigator.language).maximize().region;if(ccKnown(r))return r}catch(e){}
 try{const z=ZONE_MAP[Intl.DateTimeFormat().resolvedOptions().timeZone];if(z)return z}catch(e){}
 return "PK"}

 try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),2500);
  const r=await fetch("https://ipapi.co/country/",{signal:ac.signal});clearTimeout(to);
  if(!r.ok)return null;const code=(await r.text()).trim().toUpperCase();return ccKnown(code)?code:null}
 catch(e){return null}}

async function signUp(){
 if(authBusy)return;clearAuthMsgs();
 const full=$("suName").value.trim(),username=$("suUser").value.trim().toLowerCase(),email=$("suEmail").value.trim().toLowerCase();
 const pass=$("suPass").value,pass2=$("suPass2").value,digits=$("suPhone").value.replace(/\D/g,"");
 if(full.length<2)return authErr(t("errName"));
 if(!USERNAME_RE.test(username))return authErr(t("errUser"));
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authErr(t("errEmail"));
 if(digits.length<7||digits.length>13)return authErr(t("errPhone"));
 if(pass.length<8)return authErr(t("errPass"));
 if(pass!==pass2){setPwState(true);return authErr(t("errMatch"))}
 setPwState(false);
 if(!sb)return authErr(t("sbOff"));
 try{const r=await sb.rpc("username_available",{u:username});if(r&&r.data===false)return authErr(t("errUserTaken"))}catch(e){}
 const phone=normPhone($("suCC").value,digits);
 const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:full,username,phone},emailRedirectTo:siteUrl()}});
 if(error)return authErr(authFail(error));
 if(data&&data.user&&data.user.identities&&data.user.identities.length===0)return authErr(t("errHasAcc"));
 // Manual upsert so the profile row exists even if a database trigger fails
 const prof={id:data&&data.user&&data.user.id,full_name:full,username,email,phone,provider:"email"};
 if(prof.id)await upsertSignupProfile(prof);
 if(data&&data.session){enterFromSession(data.session.user);return}
 // No session returned (project requires email confirmation): try to sign in straight away, otherwise ask to confirm
 const si=await sb.auth.signInWithPassword({email,password:pass});
 if(si&&si.data&&si.data.session){if(prof.id)await upsertSignupProfile(prof);enterFromSession(si.data.session.user)}else authOk(t("checkEmail"));
}

let authBusy=false;
// await supabase.from("profiles").upsert({id, full_name, username, ...}); errors are logged, never block sign-up
async function upsertSignupProfile(row){try{const {error}=await sb.from("profiles").upsert(row,{onConflict:"id"});if(error)console.warn("profiles upsert:",error.message);return !error}catch(e){return false}}
async function logIn(){
 if(authBusy)return;clearAuthMsgs();
 // Read the live DOM values at submit time so browser / Google Password Manager autofill is always picked up
 const f=$("formLogin"),id=(($("auth-username")||{}).value||(f&&f.elements.username&&f.elements.username.value)||"").trim().toLowerCase(),
  pass=($("auth-password")||{}).value||(f&&f.elements.password&&f.elements.password.value)||"";
 if(!id||!pass)return authErr(t("errLoginReq"));
 if(!sb)return authErr(t("sbOff"));
 authBusy=true;
 try{
  let email=id;
  if(!id.includes("@")){try{const r=await sb.rpc("email_for_username",{u:id});email=(r&&r.data)||""}catch(e){email=""}}
  if(!email)return authErr(t("errLogin"));
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){const m=String(error.message||"").toLowerCase();
   if(m.includes("confirm"))return authErr(t("checkEmail"));
   return authErr(m.includes("invalid")||m.includes("credentials")?t("errLogin"):authFail(error))}
  if(data&&data.session)enterFromSession(data.session.user);
 }finally{authBusy=false}
}

// Enters the dashboard as soon as Supabase gives a session. The profile row is saved in the background.
function enterFromSession(user){
 if(!user||!user.id)return;
 if(S.authed&&S.user.uid===user.id)return;
 if(enteringId===user.id)return;
 enteringId=user.id;
 try{
  const md=user.user_metadata||{};
  const fullName=md.full_name||md.name||"";
  const provider=(user.app_metadata&&user.app_metadata.provider)||"email";
  applySession({uid:user.id,name:fullName,contact:user.email||phoneOf(user)||"",provider,picture:md.avatar_url||"",
   username:md.username||"",phone:md.phone||phoneOf(user)||"",verified:!!user.email_confirmed_at,key:user.id});
  cleanAuthUrl();
  saveUserRow(user).then(ok=>{if(!ok)window.addEventListener("online",()=>saveUserRow(user),{once:true})});
 }finally{enteringId=null}
}
async function saveUserRow(user){
 if(!sb)return false;
 try{
  const md=user.user_metadata||{};
  const row={id:user.id,full_name:md.full_name||md.name||"",email:user.email||null,phone:md.phone||phoneOf(user)||null,
   username:md.username||null,provider:(user.app_metadata&&user.app_metadata.provider)||"email"};
  const key="lifeone.prof."+user.id;
  if(store.get(key,null)==="ok")return true;   // already saved on this device: skip the network call on refresh
  for(let n=0;n<3;n++){
   let error=null;
   try{({error}=await DB.upsertUser(row,{ignoreDuplicates:true}))}catch(e){error=e||{message:"network"}}
   if(!error){store.set(key,"ok");return true}

function haversine(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function offlinePlace(la,ln){let b=null,bd=1e9;CITIES.forEach(c=>{const d=haversine(la,ln,c.la,c.ln);if(d<bd){bd=d;b=c}});return(bd>60?t("locNear")+" ":"")+b.n+", "+b.c}
const geoPlace=()=>geoOK()?S.user.loc:S.geo.st==="loading"?t("locating"):S.geo.st==="denied"?t("locDenied"):S.geo.st==="na"?t("locNA"):t("locAsk");
let lastGeoc=null,geoWatch=null,lastLL=null;
let lastGeocT=0,lastSyncLL=null,lastSyncT=0;
function fmtAddr(a){const pick=(...k)=>{for(const x of k)if(a[x])return a[x]};
 const parts=[pick("amenity","building","tourism","shop","leisure","historic","office"),pick("road","pedestrian","footway","path"),pick("neighbourhood","suburb","quarter","hamlet","residential"),pick("city","town","village","municipality"),pick("state_district","county")].filter(Boolean);
 return parts.filter((x,i)=>parts.indexOf(x)===i).join(", ")}
async function reverse(la,ln){ /* OpenStreetMap Nominatim: street / mohallah / landmark / city / district */
 if(lastGeoc&&(haversine(la,ln,lastGeoc[0],lastGeoc[1])<0.03||Date.now()-lastGeocT<15000))return;lastGeoc=[la,ln];lastGeocT=Date.now();
 try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=en&lat=${la}&lon=${ln}`,{signal:ac.signal,headers:{Accept:"application/json"}});clearTimeout(to);
  const j=await r.json(),f=fmtAddr(j.address||{})||String(j.display_name||"").split(",").slice(0,3).join(",").trim();
  if(f){S.user.addr=f;if(!S.user.locManual)S.user.loc=f;refreshGeoUI();syncLocation(true)}}catch(e){lastGeoc=null}}
// Saves latitude / longitude / formatted_address to profiles (cleared when sharing is off)
async function syncLocation(force){if(!sb||!S.user.uid)return;
 const on=!!S.shareOn&&S.geo.st==="ok"&&S.user.lat!=null,now=Date.now();
 if(!force&&on&&lastSyncLL&&haversine(S.user.lat,S.user.lng,lastSyncLL[0],lastSyncLL[1])<0.02&&now-lastSyncT<60000)return;
 lastSyncT=now;lastSyncLL=on?[S.user.lat,S.user.lng]:null;
 try{
  if(on){const {error:ue}=await sb.from("live_locations").upsert({owner_id:S.user.uid,latitude:S.user.lat,longitude:S.user.lng,formatted_address:S.user.addr||S.user.loc||null,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(ue)console.warn("live_locations upsert:",ue.message)}
  else await sb.from("live_locations").delete().eq("owner_id",S.user.uid);
  if(!syncLocation.cleaned){syncLocation.cleaned=true;await sb.from("profiles").update({latitude:null,longitude:null,formatted_address:null}).eq("id",S.user.uid)}
 }catch(e){}}
function applyProfLoc(r){if(!r||!r.id)return;const f=S.fam.find(x=>x.key===r.id);if(!f)return;if(r.avatar_url!==undefined)f.img=r.avatar_url||"";if(r.trust_score!=null)f.trust=r.trust_score;}
function refreshGeoUI(){renderTrust();renderTabs();fillCoords();const p=$("pLoc");if(p&&document.activeElement!==p)p.value=S.user.loc}
function onPos(p){const la=p.coords.latitude,ln=p.coords.longitude,first=S.geo.st!=="ok";S.user.lat=la;S.user.lng=ln;S.user.cc=nearestCC(la,ln);S.geo.acc=p.coords.accuracy;S.geo.st="ok";
 if(!S.user.locManual&&(first||!lastLL||haversine(la,ln,lastLL[0],lastLL[1])>5)){S.user.loc=offlinePlace(la,ln);lastLL=[la,ln]}
 if(first){S.notifs.unshift({t:t("vlive")+": "+S.user.loc,r:true});renderNotifs();refreshGeoUI()}else fillCoords();reverse(la,ln);syncLocation()}
function onErr(e){S.geo.st=e&&e.code===1?"denied":"na";refreshGeoUI()}
function startGeo(manual){
 if(manual===true){S.user.locManual=false;lastLL=null}
 if(!navigator.geolocation){S.geo.st="na";refreshGeoUI();return}
 S.geo.st="loading";refreshGeoUI();
 try{navigator.geolocation.getCurrentPosition(onPos,onErr,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  if(geoWatch===null)geoWatch=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0})}
 catch(e){S.geo.st="na";refreshGeoUI()}}
function stopGeo(){try{if(geoWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(geoWatch)}catch(e){}
 geoWatch=null;S.user.lat=null;S.user.lng=null;S.geo.st=S.geo.st==="ok"?"idle":S.geo.st;refreshGeoUI()}
function startBattery(){if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{S.user.b=Math.round(b.level*100);renderTrust()};u();b.addEventListener("levelchange",u)}).catch(()=>{})}

/* ---------- data API: Supabase tables ---------- */
const DB={
 upsertUser(row,opt){if(!sb)return Promise.resolve({error:{message:"offline"}});return sb.from("profiles").upsert(row,Object.assign({onConflict:"id"},opt||{}))},
 getProfile(id){if(!sb)return Promise.resolve({data:null});return sb.from("profiles").select("*").eq("id",id).maybeSingle()},
 async sendMessage(row){if(!sb)return {error:{message:"offline"}};try{return await sb.from("messages").insert(row)}catch(e){return {error:{message:String(e&&e.message||e)}}}},
 insertTx(row){return Promise.resolve({error:null})},
 loadTx(){return Promise.resolve({data:[],error:null})}
};

/* ---------- boot ---------- */
document.addEventListener("visibilitychange",()=>{if(S.shareOn&&!document.hidden&&!geoOK()&&S.geo.st!=="loading")startGeo()});
const SUN_IC='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_IC='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(){let d=false;try{d=localStorage.getItem("lifeone.theme")==="dark"}catch(e){}document.documentElement.classList.toggle("dark",d);const b=$("themeBtn");if(b)b.innerHTML=d?SUN_IC:MOON_IC}
function toggleTheme(){const d=!document.documentElement.classList.contains("dark");try{localStorage.setItem("lifeone.theme",d?"dark":"light")}catch(e){}applyTheme()}
function boot(){applyTheme();askNotifPerm();try{hydrateIcons()}catch(e){console.error(e)}go(savedTab());authBoot();applyLang();renderClock();setInterval(renderClock,1000)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.addEventListener("load",()=>{if(!document.querySelector(".tab-content.active"))go(savedTab())});

</script>
