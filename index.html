<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOne V1.0 Enterprise</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:light;--bg:#fff;--card:#F8FAFC;--line:#E2E8F0;--ink:#0F172A;--mut:#64748B;--pri:#7C3AED;--pri2:#F5F3FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.btn{transition:transform .15s,background .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}.btn:active{transform:scale(.96)}
.pri{background:var(--pri);color:#fff}.pri:hover{background:#6D28D9}
.out{background:#fff;border:1px solid var(--line);color:var(--ink)}.out:hover{border-color:#C4B5FD;background:var(--pri2)}
.inp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;width:100%;color:var(--ink);outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.tab-content{display:none}.tab-content.active{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);align-items:flex-end;justify-content:center;padding:1rem}
.modal.on{display:flex}@media(min-width:640px){.modal{align-items:center}}
.sheet{background:#fff;border:1px solid var(--line);border-radius:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto;padding:1.25rem;box-shadow:0 24px 60px rgba(15,23,42,.18)}
.tab{color:var(--mut)}.tab.on{color:var(--pri)}.tab.on .bar{opacity:1}.bar{opacity:0;height:3px;width:28px;border-radius:3px;background:var(--pri);transition:opacity .2s}
.ping{animation:p 1.6s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}100%{box-shadow:0 0 0 8px rgba(244,63,94,0)}}
.gp{animation:g 1.6s infinite}@keyframes g{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}100%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
.done .t{text-decoration:line-through;color:var(--mut)}
.rec{animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
.spin{animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.lock{filter:blur(5px);pointer-events:none;user-select:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0;transition:background .2s,border-color .2s}
.chk:hover{border-color:var(--pri)}
.chk svg{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s}
.chk.on{background:var(--pri);border-color:var(--pri);animation:pop .35s}.chk.on svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.25)}}
.done .t{transition:color .3s}
.ring{animation:rg .5s infinite alternate}@keyframes rg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.unauth>header,.unauth>main,.unauth>nav{display:none!important}
</style>
</head>
<body class="unauth">
<header class="sticky top-0 z-40 bg-white" style="border-bottom:1px solid var(--line)">
 <div class="max-w-3xl mx-auto flex items-center justify-between px-4 py-3 gap-2">
  <div class="flex items-center gap-2 min-w-0">
   <span class="w-8 h-8 rounded-lg pri flex items-center justify-center" data-ic="shield" data-s="18"></span>
   <b class="text-lg tracking-tight whitespace-nowrap">LifeOne <span style="color:var(--pri)">V1.0</span></b>
   <span id="proChip" class="hidden text-[10px] font-semibold px-2 py-0.5 rounded-full" style="background:var(--pri2);color:var(--pri)">PRO</span>
  </div>
  <div class="flex items-center gap-2">
   <label class="relative btn out h-9 rounded-xl px-2.5 flex items-center gap-1.5 cursor-pointer">
   <span style="color:var(--mut)" data-ic="globe" data-s="16"></span>
   <span id="flag" class="text-sm leading-none" aria-hidden="true">🇬🇧</span>
   <select id="lang" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" aria-label="Interface language">
    <option value="en">English</option><option value="ur">اردو</option><option value="ar">العربية</option><option value="zh">中文</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option>
   </select></label>
   <button id="bell" class="btn out relative w-10 h-10 rounded-full" aria-label="Notifications"><span data-ic="bell"></span>
    <span id="bellDot" class="ping absolute top-1.5 end-2 w-2.5 h-2.5 rounded-full bg-rose-500"></span></button>
   <button id="hdrAv" class="btn" aria-label="Profile"></button>
  </div>
 </div>
</header>

<main class="max-w-3xl mx-auto px-4 pt-4 pb-28">
 <section id="tab-home" class="tab-content space-y-4">
  <div class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF 0%,#FFFFFF 70%);border:1px solid #DDD6FE">
   <div class="flex items-start justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0"><div class="av"></div>
     <div class="min-w-0"><p class="text-xs" style="color:var(--mut)" id="today"></p><h1 class="text-lg font-bold leading-snug" id="greet"></h1></div></div>
    <span class="px-2.5 py-1 rounded-full text-xs font-semibold inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 shrink-0"><span data-ic="flame" data-s="13"></span><b id="streak">0</b><span data-i18n="streak"></span></span>
   </div>
   <p class="text-sm mt-1.5" style="color:var(--mut)" data-i18n="tag"></p>
   <div class="flex flex-wrap items-center gap-2 mt-3">
    <button id="shieldPill" onclick="toggleShare()" class="btn px-3 py-1.5 rounded-full text-xs font-medium border"></button>
    <span id="homeVer" class="contents"></span>
   </div>
  </div>

  <div class="rounded-2xl p-4 bg-white" style="border:1px solid #DDD6FE;box-shadow:0 12px 32px -14px rgba(124,58,237,.28)">
   <div class="flex items-center justify-between gap-2 mb-2">
    <div class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg pri flex items-center justify-center" data-ic="sparkle" data-s="15"></span><b class="text-sm" data-i18n="cpTitle"></b></div>
    <span id="cpUsage" class="text-[11px]" style="color:var(--mut)"></span>
   </div>
   <div class="flex items-center gap-2 rounded-xl px-3 py-2" style="border:1px solid var(--line)">
    <input id="cpIn" class="flex-1 min-w-0 outline-none bg-transparent text-sm" data-ph="cpPh">
    <button id="cpMic" onclick="cpVoice()" class="btn out w-8 h-8 rounded-lg shrink-0" aria-label="Voice input"></button>
    <button onclick="cpRun()" class="btn pri w-8 h-8 rounded-lg shrink-0" aria-label="Ask" data-ic="send" data-s="15"></button>
   </div>
   <div id="cpChips" class="flex flex-wrap gap-1.5 mt-2.5"></div>
   <div id="cpOut" class="hidden mt-3"></div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
   <div class="card p-5 flex items-center gap-4">
    <svg width="96" height="96" viewBox="0 0 96 96" class="shrink-0" aria-hidden="true"><defs><linearGradient id="gHar" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient></defs><circle cx="48" cy="48" r="38" fill="none" stroke="#E2E8F0" stroke-width="9"/><circle id="ringArc" cx="48" cy="48" r="38" fill="none" stroke="url(#gHar)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 48 48)" style="transition:stroke-dashoffset .6s ease"/><text id="ringPct" x="48" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">0%</text></svg>
    <div class="min-w-0"><p class="text-[11px] uppercase tracking-wider" style="color:var(--mut)" data-i18n="harmony"></p><p id="cnt" class="font-semibold mt-1 text-sm"></p><p id="ringSub" class="text-xs mt-1" style="color:var(--mut)"></p></div>
   </div>
   <div class="card p-5">
    <h3 class="font-semibold text-sm mb-3" data-i18n="habits"></h3>
    <div id="habitList" class="space-y-3.5"></div>
   </div>
  </div>

  <div class="card p-5">
   <div class="flex items-center justify-between gap-2 mb-4">
    <h2 class="font-semibold" data-i18n="timeline"></h2>
    <button class="btn pri rounded-full ps-3 pe-4 py-1.5 text-xs font-medium" onclick="openM('mTask')"><span data-ic="plus" data-s="14"></span><span data-i18n="newTask"></span></button>
   </div>
   <ol id="homeTasks" class="list-none"></ol>
  </div>

  <div class="card p-5">
   <h3 class="font-semibold text-sm mb-3" data-i18n="familyNow"></h3>
   <div id="homeFam" class="space-y-2.5"></div>
  </div>
 </section>

 <section id="tab-tasks" class="tab-content space-y-4">
  <div class="flex items-center justify-between"><h2 class="text-xl font-bold" data-i18n="tasks"></h2>
   <button class="btn pri rounded-full ps-3 pe-4 py-2 text-sm font-medium" onclick="openM('mTask')"><span data-ic="plus" data-s="16"></span><span data-i18n="newTask"></span></button></div>
  <div id="filters" class="flex gap-2 overflow-x-auto pb-1"></div>
  <ul id="taskList" class="space-y-2"></ul>
 </section>

 <section id="tab-money" class="tab-content space-y-4">
  <div class="flex items-start justify-between gap-3">
   <div class="min-w-0"><h2 class="text-lg font-bold" data-i18n="trk"></h2><p id="monthLbl" class="text-xs mt-0.5" style="color:var(--mut)"></p></div>
   <button id="maskBtn" onclick="toggleMask()" class="btn out w-9 h-9 rounded-full shrink-0"></button>
  </div>
  <div id="curBar" class="flex gap-1.5 overflow-x-auto pb-1" style="scrollbar-width:none"></div>
  <div class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF,#fff);border:1px solid #DDD6FE">
   <div class="flex items-center justify-between gap-2"><p class="text-[11px] uppercase tracking-wider" style="color:var(--mut)" data-i18n="bal"></p><span id="srate" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"></span></div>
   <p id="bal" class="text-2xl sm:text-3xl font-bold mt-2 tracking-tight"></p>
  </div>
  <div class="grid grid-cols-2 gap-3">
   <div class="card p-4"><div class="flex items-center gap-2 text-xs text-emerald-600 font-medium"><span data-ic="arrowin" data-s="16"></span><span data-i18n="inf"></span></div><p id="inf" class="text-base sm:text-lg font-semibold mt-1.5"></p></div>
   <div class="card p-4"><div class="flex items-center gap-2 text-xs text-rose-600 font-medium"><span data-ic="arrowout" data-s="16"></span><span data-i18n="outf"></span></div><p id="outf" class="text-base sm:text-lg font-semibold mt-1.5"></p></div>
  </div>
  <div class="card p-5">
   <div class="flex items-center justify-between gap-2"><h3 class="font-semibold text-sm" data-i18n="alloc"></h3><b id="allocTot" class="text-sm"></b></div>
   <ul id="alloc" class="divide-y divide-slate-200 mt-1"></ul>
  </div>
  <div class="card p-5">
   <h3 class="font-semibold text-sm mb-3" data-i18n="payRails"></h3>
   <div class="grid grid-cols-3 gap-2">
    <button onclick="payHook('bank')" class="btn out py-2 rounded-xl text-xs" data-i18n="bank"></button>
    <button onclick="payHook('crypto')" class="btn out py-2 rounded-xl text-xs" data-i18n="crypto"></button>
    <button onclick="payHook('card')" class="btn out py-2 rounded-xl text-xs" data-i18n="card"></button>
   </div>
  </div>
  <div class="card p-5">
   <div class="flex items-center justify-between gap-2 mb-3"><h3 class="font-semibold text-sm" data-i18n="txTitle"></h3></div>
   <input id="txSearch" oninput="renderTx()" class="inp mb-1" data-ph="txSearch">
   <ul id="txList" class="divide-y divide-slate-200"></ul>
   <p class="text-[11px] mt-2" style="color:var(--mut)" data-i18n="sample"></p>
  </div>
  <p id="rate" class="text-[11px] text-center" style="color:var(--mut)"></p>
 </section>

 <section id="tab-family" class="tab-content space-y-3">
  <h2 class="text-xl font-bold" data-i18n="fam"></h2>
  <div id="famList" class="space-y-3"></div>
 </section>

 <section id="tab-profile" class="tab-content space-y-4">
  <h2 class="text-lg font-bold" data-i18n="profile"></h2>
  <div id="authCard" class="card p-5"></div>
  <div class="card p-5 space-y-4">
   <div class="flex items-center gap-4"><div class="av big"></div>
    <label class="btn out px-4 py-2 rounded-xl text-sm cursor-pointer"><span data-ic="upload" data-s="16"></span><span data-i18n="photo"></span><input id="file" type="file" accept="image/*" class="hidden"></label></div>
   <label class="block text-sm"><span style="color:var(--mut)" data-i18n="name"></span><input id="pName" class="inp mt-1"></label>
   <label class="block text-sm"><span style="color:var(--mut)" data-i18n="email"></span><input id="pEmail" type="email" class="inp mt-1"></label>
   <div class="text-sm"><span style="color:var(--mut)" data-i18n="loc"></span><input id="pLoc" class="inp mt-1" readonly tabindex="-1" style="background:#F1F5F9;cursor:not-allowed"><p class="text-xs mt-1.5 inline-flex items-center gap-1" style="color:var(--mut)"><span data-ic="lock" data-s="12"></span><span data-i18n="locLock"></span></p></div>
   <button id="saveP" class="btn pri w-full rounded-xl py-2.5 text-sm font-medium" data-i18n="save"></button>
  </div>
  <div id="demoBox"></div>
  <div id="profTrust" class="card p-5"></div>
  <div id="proCard" class="rounded-2xl p-5" style="background:linear-gradient(135deg,#F5F3FF,#fff);border:1px solid #DDD6FE"></div>
  <div class="card p-5 space-y-3">
   <button class="btn out w-full py-2.5 rounded-xl text-sm" onclick="openM('mPw')"><span data-ic="key" data-s="18"></span><span data-i18n="pw"></span></button>
   <button class="btn w-full py-2.5 rounded-xl text-sm bg-rose-50 text-rose-600 border border-rose-200" onclick="openM('mOut')"><span data-ic="logout" data-s="18"></span><span data-i18n="logout"></span></button>
  </div>
 </section>
</main>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-white" style="border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)">
 <div class="max-w-3xl mx-auto grid grid-cols-5" id="tabs"></div>
</nav>

<!-- Modals -->
<div id="mTask" class="modal"><div class="sheet space-y-3">
 <h3 class="font-bold text-lg" data-i18n="newTask"></h3>
 <input id="tTitle" class="inp" data-ph="title"><select id="tCat" class="inp"></select><select id="tUrg" class="inp"></select>
 <div><span class="text-sm" style="color:var(--mut)" data-i18n="time"></span><input id="tTime" type="time" class="inp mt-1"><button type="button" onclick="plus1()" class="text-sm mt-1.5 inline-flex items-center gap-1" style="color:var(--pri)"><span data-ic="clock" data-s="14"></span><span data-i18n="in1"></span></button></div>
 <div class="flex gap-2"><button class="btn out flex-1 py-2.5 rounded-xl" onclick="closeM('mTask')" data-i18n="cancel"></button>
 <button class="btn pri flex-1 py-2.5 rounded-xl" onclick="addTask()" data-i18n="add"></button></div>
</div></div>

<div id="mNotif" class="modal"><div class="sheet">
 <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg" data-i18n="notif"></h3>
  <button class="text-sm" style="color:var(--pri)" onclick="readAll()" data-i18n="readAll"></button></div>
 <ul id="nList" class="space-y-2"></ul>
 <button class="btn out w-full py-2.5 rounded-xl mt-3" onclick="closeM('mNotif')" data-i18n="close"></button>
</div></div>

<div id="mCall" class="modal"><div class="sheet text-center space-y-3">
 <div id="vidBox" class="hidden relative rounded-2xl overflow-hidden bg-slate-900" style="aspect-ratio:4/3">
  <div id="remoteTile" class="absolute inset-0 flex items-center justify-center"><div id="callAv2"></div></div>
  <video id="localV" autoplay muted playsinline class="absolute bottom-2 end-2 w-24 rounded-lg border-2 border-white bg-slate-700" style="aspect-ratio:3/4;object-fit:cover"></video>
 </div>
 <div id="audBox" class="pt-2"><div class="mx-auto w-fit" id="callAv"></div></div>
 <h3 class="font-bold text-xl" id="callName"></h3><div id="callLoc" class="text-start"></div>
 <p id="callType" class="text-[11px] font-semibold uppercase tracking-wider" style="color:var(--mut)"></p><p id="callState" style="color:var(--pri)"></p><p id="callNote" class="text-[11px]" style="color:var(--mut)"></p>
 <p id="callTime" class="text-2xl font-mono">00:00</p>
 <p class="text-xs inline-flex items-center gap-1" style="color:var(--mut)"><span data-ic="lock" data-s="14"></span><span data-i18n="secure"></span></p>
 <div class="grid grid-cols-5 gap-2 pt-1">
  <button id="bMute" onclick="cMute()" class="btn out flex-col py-3 rounded-2xl text-[11px]"><span id="icMute"></span><span data-i18n="mute"></span></button>
  <button id="bSpk" onclick="cSpk()" class="btn out flex-col py-3 rounded-2xl text-[11px]"><span data-ic="speaker"></span><span data-i18n="speaker"></span></button>
  <button id="bVid" onclick="cVid()" class="btn out flex-col py-3 rounded-2xl text-[11px]"><span data-ic="video"></span><span data-i18n="video"></span></button>
  <button id="bFlip" onclick="cFlip()" class="btn out flex-col py-3 rounded-2xl text-[11px] hidden"><span data-ic="flip"></span><span data-i18n="flip"></span></button>
  <button onclick="endCall()" class="btn flex-col py-3 rounded-2xl text-[11px] bg-rose-500 text-white"><span data-ic="phone"></span><span data-i18n="end"></span></button>
 </div>
</div></div>

<div id="mChat" class="modal"><div class="sheet flex flex-col" style="height:75vh">
 <div class="flex justify-between items-center pb-2" style="border-bottom:1px solid var(--line)">
  <div class="flex items-center gap-3 min-w-0"><div id="chatAv"></div><div class="min-w-0"><h3 class="font-bold truncate" id="chatName"></h3><div id="chatLoc" class="text-xs mt-0.5 flex flex-wrap items-center gap-1"></div>
  <p class="text-xs text-emerald-600 inline-flex items-center gap-1"><span data-ic="lock" data-s="12"></span><span data-i18n="enc"></span></p></div></div>
  <button class="p-2" style="color:var(--mut)" onclick="closeChat()" aria-label="Close" data-ic="x"></button>
 </div>
 <div id="msgs" class="flex-1 overflow-auto space-y-2 py-3"></div>
 <div id="inBar" class="flex gap-2 pt-2"><input id="msgIn" class="inp" data-ph="msg">
  <button class="btn out w-11 rounded-xl shrink-0" onclick="recStart()" aria-label="Voice note" data-ic="mic"></button>
  <button class="btn pri w-11 rounded-xl shrink-0" onclick="sendMsg()" aria-label="Send" data-ic="send"></button></div>
 <div id="recBar" class="hidden items-center gap-3 pt-2">
  <button class="btn out w-11 h-11 rounded-xl shrink-0" onclick="recStop(false)" aria-label="Cancel" data-ic="x"></button>
  <div class="flex-1 flex items-center gap-2 px-3 py-2.5 rounded-xl bg-rose-50 text-rose-600"><i class="rec w-2.5 h-2.5 rounded-full bg-rose-500"></i><span data-i18n="rec"></span><b id="recT" class="ms-auto font-mono">0:00</b></div>
  <button class="btn pri w-11 h-11 rounded-xl shrink-0" onclick="recStop(true)" aria-label="Send voice note" data-ic="send"></button></div>
</div></div>

<div id="mPw" class="modal"><div class="sheet space-y-3">
 <h3 class="font-bold text-lg" data-i18n="pw"></h3>
 <input id="pw1" type="password" class="inp" data-ph="oldPw"><input id="pw2" type="password" class="inp" data-ph="newPw">
 <p id="pwErr" class="text-sm text-rose-600"></p>
 <div class="flex gap-2"><button class="btn out flex-1 py-2.5 rounded-xl" onclick="closeM('mPw')" data-i18n="cancel"></button>
 <button class="btn pri flex-1 py-2.5 rounded-xl" onclick="changePw()" data-i18n="save"></button></div>
</div></div>

<div id="mPay" class="modal"><div class="sheet" style="max-width:560px">
 <div class="flex items-center justify-between mb-3">
  <div class="flex items-center gap-2" style="color:var(--pri)"><span data-ic="crown" data-s="20"></span><h3 class="font-bold text-lg" style="color:var(--ink)" data-i18n="planT"></h3></div>
  <button onclick="closeM('mPay')" class="btn out w-8 h-8 rounded-full" aria-label="Close" data-ic="x" data-s="14"></button>
 </div>
 <p id="planHint" class="text-sm mb-3 rounded-xl px-3 py-2 hidden" style="background:var(--pri2);color:#5B21B6"></p>
 <div id="planGrid" class="grid gap-3"></div>
 <p class="text-[11px] mt-3 text-center" style="color:var(--mut)" data-i18n="demoPay"></p>
</div></div>

<div id="mOut" class="modal"><div class="sheet text-center space-y-3">
 <span class="mx-auto w-12 h-12 rounded-full flex items-center justify-center" style="background:var(--pri2);color:var(--pri)" data-ic="logout" data-s="24"></span>
 <h3 class="font-bold text-lg" id="outT" data-i18n="logoutQ"></h3>
 <div class="flex gap-2" id="outBtns"><button class="btn out flex-1 py-2.5 rounded-xl" onclick="closeM('mOut')" data-i18n="cancel"></button>

 const l=q.toLowerCase();let c;

 if(a&&a[1]){let tm=null;if(a[2]){let h=+a[2];const ap=(a[4]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(h<24)tm=String(h).padStart(2,"0")+":"+String(+(a[3]||0)).padStart(2,"0")}
  const title=a[1].charAt(0).toUpperCase()+a[1].slice(1),cat=/gym|workout|doctor|dentist|health|run|walk/i.test(title)?"Health":/budget|pay|bill|invoice|bank|tax/i.test(title)?"Finance":/client|meeting|report|proposal|email|work|review/i.test(title)?"Work":"Personal";

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return authErr(t("errEmail"));contact=e;key="e:"+e}
 else{const cc=$("aCC").value,d=$("aPhone").value.replace(/\D/g,"");
  if(d.length<7||d.length>13)return authErr(t("errPhone"));contact=cc+" "+d;key="p:"+cc+d}
 const accs=store.get(ACC_KEY,{});
 if(authMode==="signin"&&!accs[key])return authErr(t("errNoAcc"));
 if(authMode==="signup"&&accs[key])return authErr(t("errHasAcc"));
 openOtp({contact,key,name:authMode==="signup"?name:(accs[key]||{}).name});
}
function newCode(){otpDraft.code=String(100000+Math.floor(Math.random()*900000));otpDraft.exp=Date.now()+5*60000;otpDraft.tries=0;otpDraft.resendAt=Date.now()+30000}
function openOtp(d){otpDraft=d;newCode();
 $("otpSub").textContent=t("otpSub").replace("{c}",d.contact);
 $("otpDemo").textContent=t("demoOtp").replace("{c}",otpDraft.code);
 document.querySelectorAll(".otpi").forEach(b=>b.value="");
 $("otpErr").textContent="";openM("mOtp");
 clearInterval(otpTimer);otpTimer=setInterval(updateResend,1000);updateResend();
 setTimeout(()=>{const f=document.querySelector(".otpi");if(f)f.focus()},60)}
function updateResend(){const b=$("otpResend");if(!otpDraft||!b)return;const s=Math.ceil((otpDraft.resendAt-Date.now())/1000);
 b.disabled=s>0;b.textContent=s>0?t("resendIn").replace("{s}",s):t("resend")}
function resendOtp(){if(!otpDraft||Date.now()<otpDraft.resendAt)return;newCode();
 $("otpDemo").textContent=t("demoOtp").replace("{c}",otpDraft.code);
 document.querySelectorAll(".otpi").forEach(b=>b.value="");$("otpErr").textContent="";
 document.querySelector(".otpi").focus();updateResend()}
function otpFail(msg){$("otpErr").textContent=msg;document.querySelectorAll(".otpi").forEach(b=>b.value="");document.querySelector(".otpi").focus()}
function verifyOtp(){if(!otpDraft)return;
 const v=[...document.querySelectorAll(".otpi")].map(i=>i.value).join("");
 if(Date.now()>otpDraft.exp)return otpFail(t("errOtpExp"));
 if(otpDraft.tries>=5)return otpFail(t("errOtpMax"));
 if(v.length<6)return otpFail(t("errOtp"));
 if(v!==otpDraft.code){otpDraft.tries++;return otpFail(otpDraft.tries>=5?t("errOtpMax"):t("errOtp"))}
 const accs=store.get(ACC_KEY,{});
 let acc=accs[otpDraft.key];
 if(!acc){acc={name:otpDraft.name||"",contact:otpDraft.contact,key:otpDraft.key,createdAt:Date.now()};accs[otpDraft.key]=acc;store.set(ACC_KEY,accs)}
 otpDraft=null;clearInterval(otpTimer);applySession(acc)}
function buildOtpBoxes(){const w=$("otpBoxes");
 w.innerHTML=Array.from({length:6},(_,i)=>`<input class="otpi inp text-center text-lg font-semibold" style="width:2.6rem;height:3rem;padding:0" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join("");
 const bx=[...w.querySelectorAll(".otpi")];
 bx.forEach((b,i)=>{
  b.addEventListener("input",()=>{b.value=b.value.replace(/\D/g,"").slice(-1);if(b.value&&bx[i+1])bx[i+1].focus();if(bx.every(x=>x.value))verifyOtp()});
  b.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!b.value&&bx[i-1])bx[i-1].focus()});
  b.addEventListener("paste",e=>{e.preventDefault();const d=(e.clipboardData||window.clipboardData).getData("text").replace(/\D/g,"").slice(0,6);
   d.split("").forEach((c,k)=>{if(bx[k])bx[k].value=c});(bx[Math.min(d.length,5)]||b).focus();if(d.length===6)verifyOtp()})});
}
function b64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function onGoogleCred(r){try{const p=JSON.parse(b64url(r.credential.split(".")[1]));
 const contact=(p.email||"").toLowerCase(),key="g:"+contact,accs=store.get(ACC_KEY,{});
 if(!accs[key]){accs[key]={name:p.name||contact,contact,key,createdAt:Date.now(),provider:"google"};store.set(ACC_KEY,accs)}
 applySession(accs[key])}catch(e){authErr(t("errGoogle"))}}
function googleSignIn(){
 if(AUTH_CFG.googleClientId&&window.google&&google.accounts){
  google.accounts.id.initialize({client_id:AUTH_CFG.googleClientId,callback:onGoogleCred});google.accounts.id.prompt();return}
 if(!AUTH_CFG.googleClientId)toast(t("gDemo"));
 const name=$("aName").value.trim()||"Google User",contact="google-demo@lifeone.local",key="g:"+contact,accs=store.get(ACC_KEY,{});
 if(!accs[key]){accs[key]={name,contact,key,createdAt:Date.now(),provider:"google-demo"};store.set(ACC_KEY,accs)}
 applySession(accs[key])}
function authBoot(){
 $("aCC").innerHTML=COUNTRIES.map(c=>`<option value="${c.d}">${c.n} ${c.d}</option>`).join("");
 buildOtpBoxes();setAuthMode("signin");setAuthMethod("email");
 const s=store.get(SESS_KEY,null);
 if(s&&s.contact){freshState(s.name);applySession(s)}
 else{freshState("");showAuth()}
}
// Sign-out: clears the local session and returns to the auth screen
function logout(){store.del(SESS_KEY);closeM("mOut");freshState("");showAuth();renderAll()}
function login(){showAuth()}

 $("pName").value=S.user.name;$("pEmail").value=S.user.email;$("pLoc").value=S.user.loc;fillCoords()}

const CITIES="Kahror Pakka|PK|29.6243|71.9171;Lodhran|PK|29.5393|71.6324;Multan|PK|30.1575|71.5249;Bahawalpur|PK|29.3956|71.6836;Vehari|PK|30.0453|72.3489;Lahore|PK|31.5497|74.3436;Karachi|PK|24.8607|67.0011;Islamabad|PK|33.6844|73.0479;Rawalpindi|PK|33.5651|73.0169;Faisalabad|PK|31.4504|73.1350;Peshawar|PK|34.0151|71.5249;Quetta|PK|30.1798|66.9750;Hyderabad|PK|25.3960|68.3578;Sialkot|PK|32.4945|74.5229;Gujranwala|PK|32.1877|74.1945;Sukkur|PK|27.7052|68.8574;Jhang|PK|31.2681|72.3181;Sargodha|PK|32.0740|72.6861;Mardan|PK|34.1989|72.0231;Abbottabad|PK|34.1688|73.2215;Dubai|AE|25.2048|55.2708;Abu Dhabi|AE|24.4539|54.3773;Riyadh|SA|24.7136|46.6753;Jeddah|SA|21.4858|39.1925;Doha|QA|25.2854|51.5310;Kuwait City|KW|29.3759|47.9774;Muscat|OM|23.5880|58.3829;Istanbul|TR|41.0082|28.9784;Cairo|EG|30.0444|31.2357;London|GB|51.5074|-0.1278;Manchester|GB|53.4808|-2.2426;Paris|FR|48.8566|2.3522;Berlin|DE|52.5200|13.4050;Madrid|ES|40.4168|-3.7038;Rome|IT|41.9028|12.4964;Amsterdam|NL|52.3676|4.9041;New York|US|40.7128|-74.0060;Los Angeles|US|34.0522|-118.2437;Chicago|US|41.8781|-87.6298;Houston|US|29.7604|-95.3698;San Francisco|US|37.7749|-122.4194;Toronto|CA|43.6532|-79.3832;Vancouver|CA|49.2827|-123.1207;Mexico City|MX|19.4326|-99.1332;Sao Paulo|BR|-23.5505|-46.6333;Delhi|IN|28.6139|77.2090;Mumbai|IN|19.0760|72.8777;Bengaluru|IN|12.9716|77.5946;Kolkata|IN|22.5726|88.3639;Dhaka|BD|23.8103|90.4125;Kabul|AF|34.5553|69.2075;Tehran|IR|35.6892|51.3890;Beijing|CN|39.9042|116.4074;Shanghai|CN|31.2304|121.4737;Shenzhen|CN|22.5431|114.0579;Hong Kong|HK|22.3193|114.1694;Tokyo|JP|35.6762|139.6503;Seoul|KR|37.5665|126.9780;Singapore|SG|1.3521|103.8198;Kuala Lumpur|MY|3.1390|101.6869;Bangkok|TH|13.7563|100.5018;Jakarta|ID|-6.2088|106.8456;Sydney|AU|-33.8688|151.2093;Melbourne|AU|-37.8136|144.9631;Johannesburg|ZA|-26.2041|28.0473;Lagos|NG|6.5244|3.3792;Nairobi|KE|-1.2921|36.8219;Moscow|RU|55.7558|37.6173".split(";").map(s=>{const p=s.split("|");return{n:p[0],c:p[1],la:+p[2],ln:+p[3]}});
function haversine(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function offlinePlace(la,ln){let b=null,bd=1e9;CITIES.forEach(c=>{const d=haversine(la,ln,c.la,c.ln);if(d<bd){bd=d;b=c}});return(bd>60?t("locNear")+" ":"")+b.n+", "+b.c}
const geoPlace=()=>geoOK()?S.user.loc:S.geo.st==="loading"?t("locating"):S.geo.st==="denied"?t("locDenied"):S.geo.st==="na"?t("locNA"):t("locAsk");
let lastGeoc=null,geoWatch=null,lastLL=null;
async function reverse(la,ln){ /* online refinement; hosts that block network requests keep the offline city name */
 if(lastGeoc&&haversine(la,ln,lastGeoc[0],lastGeoc[1])<1)return;lastGeoc=[la,ln];
 try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),4000);
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=en&lat=${la}&lon=${ln}`,{signal:ac.signal});clearTimeout(to);
  const a=(await r.json()).address||{},n=a.city||a.town||a.village||a.suburb||a.county||a.state_district||a.state;
  if(n&&!S.user.locManual){S.user.loc=n+", "+(a.country_code||"").toUpperCase();refreshGeoUI()}}catch(e){}}
function refreshGeoUI(){renderTrust();renderTabs();fillCoords();const p=$("pLoc");if(p&&document.activeElement!==p)p.value=S.user.loc}
function onPos(p){const la=p.coords.latitude,ln=p.coords.longitude,first=S.geo.st!=="ok";S.user.lat=la;S.user.lng=ln;S.user.cc=nearestCC(la,ln);S.geo.acc=p.coords.accuracy;S.geo.st="ok";
 if(!S.user.locManual&&(first||!lastLL||haversine(la,ln,lastLL[0],lastLL[1])>5)){S.user.loc=offlinePlace(la,ln);lastLL=[la,ln]}
 if(first){S.notifs.unshift({t:t("vlive")+": "+S.user.loc,r:false});renderNotifs();refreshGeoUI()}else fillCoords();reverse(la,ln)}
function onErr(e){S.geo.st=e&&e.code===1?"denied":"na";refreshGeoUI()}
function startGeo(manual){if(!navigator.geolocation){S.geo.st="na";refreshGeoUI();return}
 if(manual===true){S.user.locManual=false;lastLL=null}
 S.geo.st="loading";refreshGeoUI();
 navigator.geolocation.getCurrentPosition(onPos,onErr,{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
 if(geoWatch===null)geoWatch=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:10000})}
function startBattery(){if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{S.user.b=Math.round(b.level*100);renderTrust()};u();b.addEventListener("levelchange",u)}).catch(()=>{})}

/* ---------- boot ---------- */
document.addEventListener("visibilitychange",()=>{if(geoStarted&&!document.hidden&&!geoOK()&&S.geo.st!=="loading")startGeo()});
function boot(){try{hydrateIcons()}catch(e){console.error(e)}go("home");authBoot();applyLang()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.addEventListener("load",()=>{if(!document.querySelector(".tab-content.active"))go("home")});
